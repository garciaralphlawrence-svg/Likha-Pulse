services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: paph
      POSTGRES_PASSWORD: paph
      POSTGRES_DB: paph_quotes
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://paph:paph@db:5432/paph_quotes
    depends_on: [db]
    ports: ["8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  pgdata:
