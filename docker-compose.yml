services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: likha_pulse
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:pulse@db:5432/likha_pulse
    depends_on: [db]
    ports: ["8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  pgdata:
